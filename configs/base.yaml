# Real run scale, meant for Leonardo (1-4x A100). Tune n_puzzles/epochs
# against actual wall-clock time once a debug-QOS smoke run has been done.

data:
  n_puzzles: 200000
  target_clues: 40
  seed: 0
  val_fraction: 0.05
  test_fraction: 0.05
  output_path: data/sudoku_base.npz

model:
  d_model: 384
  n_layers: 8
  n_heads: 8
  dim_feedforward: 1536
  dropout: 0.1
  num_iterations: 1

train:
  batch_size: 256
  lr: 3.0e-4
  epochs: 30
  device: auto
  seed: 0
  log_path: logs/base.jsonl
  checkpoint_path: checkpoints/base.pt
  log_every: 100
